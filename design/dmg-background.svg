  <text x="64" y="338" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#1F1B17">macOS says “Dangle Not Opened”?</text>
  <text x="64" y="358" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="12.5" fill="#5F564D">Click Done, then System Settings › Privacy &amp; Security › Open Anyway. Only once.</text>
  <text x="64" y="382" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="12" fill="#8F857A">Or in Terminal:</text>
