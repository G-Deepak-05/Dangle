name: Release

# Push a tag like v0.1.0 to build a universal macOS DMG and a Windows installer and
# attach both to one draft GitHub Release. Review the draft, then press Publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require('./package.json');
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : `v${version}`;
            const body = [
              'A tiny thing for your desktop.',
              '',
              '## macOS (Apple Silicon and Intel, macOS 11+)',
              '1. Download **Dangle_…_universal.dmg**, open it, and drag **Dangle** into **Applications**.',
              '2. The first time only, macOS says it can\'t verify Dangle. Click **Done**, open **System Settings › Privacy & Security**, scroll to **Security**, and click **Open Anyway** next to "Dangle was blocked". Confirm with your password.',
              '   Prefer Terminal? Run `xattr -dr com.apple.quarantine /Applications/Dangle.app` instead.',
              '',
              '## Windows (10 and 11, 64-bit)',
              '1. Download **Dangle_…_x64-setup.exe** and run it. No admin rights are needed.',
              '2. If Windows shows "Windows protected your PC", click **More info**, then **Run anyway**.',
              '3. Dangle lives in the system tray, next to the clock.',
              '',
              'Already have Dangle 0.1.2 or later? It updates itself. You\'ll see a "Restart to update" note in the app.',
              '',
              'Dangle isn\'t signed by Apple or Microsoft yet, so your system asks you to confirm once. It needs no account and makes no network requests.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Dangle ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Test
        shell: bash
        run: |
          npm test
          npm run typecheck
          npx vite build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles so installed apps can verify them before installing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
