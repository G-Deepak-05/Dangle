name: Release

# Push a tag like v0.1.0 to build a universal macOS DMG and a Windows installer and
# attach both to one draft GitHub Release. Review the draft, then press Publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require('./package.json');
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : `v${version}`;
            const body = [
              'A tiny thing for your desktop.',
              '',
              '## macOS (Apple Silicon and Intel, macOS 11+)',
              '1. Download **Dangle_…_universal.dmg**, open it, and drag **Dangle** into **Applications**.',
              '2. The first time only, macOS says it can\'t verify Dangle. Click **Done**, open **System Settings › Privacy & Security**, scroll to **Security**, and click **Open Anyway** next to "Dangle was blocked". Confirm with your password.',
              '   Prefer Terminal? Run `xattr -dr com.apple.quarantine /Applications/Dangle.app` instead.',
              '',
              '## Windows (10 and 11, 64-bit)',
              '1. Download **Dangle_…_x64-setup.exe** and run it. No admin rights are needed.',
              '2. If Windows shows "Windows protected your PC", click **More info**, then **Run anyway**.',
              '3. Dangle lives in the system tray, next to the clock.',
              '',
              'Already have Dangle 0.1.2 or later? It updates itself. You\'ll see a "Restart to update" note in the app.',
              '',
              'Dangle isn\'t signed by Apple or Microsoft yet, so your system asks you to confirm once. It needs no account and collects nothing about you.',
              '',
              '## Verify your download (optional)',
              'Every file is listed in **SHA256SUMS**, signed with the Dangle release key, and carries a GitHub build attestation. Check one with `gh attestation verify <file> -R G-Deepak-05/Dangle`. Full steps: [docs/VERIFY.md](https://github.com/G-Deepak-05/Dangle/blob/main/docs/VERIFY.md).',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Dangle ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Test
        shell: bash
        run: |
          npm test
          npm run typecheck
          npx vite build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles so installed apps can verify them before installing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Runs once both installers are attached: lists a checksum for every file, has GitHub
  # attest that each one was built here from this commit, and GPG-signs the list when
  # the GPG_PRIVATE_KEY / GPG_PASSPHRASE secrets are set. See docs/VERIFY.md.
  provenance:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - name: Download release files
        run: |
          mkdir dist && cd dist
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | test("^SHA256SUMS") | not) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$name"
          done
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: SHA256SUMS

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::GPG_PRIVATE_KEY isn't set; publishing unsigned checksums."
            exit 0
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Attach to the release
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .tag_name)
          gh release upload "$tag" SHA256SUMS $(ls SHA256SUMS.asc 2>/dev/null) --clobber -R "$GITHUB_REPOSITORY"
